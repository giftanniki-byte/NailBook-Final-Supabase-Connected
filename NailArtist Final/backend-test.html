<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NailBook Backend Test</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#fff5f8;color:#111827;padding:40px}.card{max-width:820px;margin:auto;background:#fff;border-radius:22px;padding:30px;box-shadow:0 18px 50px #3b172015}h1{margin-top:0}.item{border:1px solid #e5e7eb;border-radius:13px;padding:16px;margin:10px 0}.ok{color:#09883f}.bad{color:#e63863}.note{color:#6b7280;font-size:13px}</style></head><body><div class="card"><h1>NailBook Backend Test</h1><p>Use this page after running <code>nailbook.sql</code> in Supabase.</p><div id="client" class="item">Testing...</div><div id="services" class="item">Testing...</div><div id="artists" class="item">Testing...</div><div id="auth" class="item">Testing...</div><p class="note">Authentication is not an error when nobody is logged in. Create an account or log in to test an active session.</p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>
(async()=>{const set=(id,ok,title,text)=>document.getElementById(id).innerHTML=`<strong class="${ok?'ok':'bad'}">${ok?'✓':'✗'} ${title}</strong><br>${text}`;try{set('client',true,'Supabase client','Client loaded.');const s=await supabaseClient.from('services').select('service_id',{count:'exact',head:false});if(s.error)throw new Error('Services: '+s.error.message);set('services',true,'Services table',`${s.data.length} services returned.`);const a=await supabaseClient.from('v_artist_directory').select('artist_id,business_name,location');if(a.error)throw new Error('Artist directory: '+a.error.message);set('artists',true,'Artist directory view',`${a.data.length} artists returned. Create an artist account to add one.`);const u=await supabaseClient.auth.getUser();if(u.data.user){const r=await supabaseClient.rpc('ensure_nailbook_profile');if(r.error) throw new Error('Profile provisioning: '+r.error.message);set('auth',true,'Authentication',`Authenticated as ${u.data.user.email}. Profile provisioning works.`)}else{set('auth',true,'Authentication','Supabase Authentication is configured. No user is currently logged in.')}}catch(e){console.error(e);set('auth',false,'Backend test error',e.message||String(e));}})();</script></body></html>
