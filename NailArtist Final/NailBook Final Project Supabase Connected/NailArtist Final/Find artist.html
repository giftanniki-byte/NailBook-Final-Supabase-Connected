<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>NailBook | Find Artists</title>

    <!-- Shared NailBook styles -->
    <link
        rel="stylesheet"
        href="nailbook-shared.css"
    >

    <style>
        /* =========================================================
           GENERAL STYLES
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            color: #171b2d;
            background: #fafbfc;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button,
        input,
        select {
            font: inherit;
        }


        /* =========================================================
           NAVIGATION BAR
        ========================================================= */

        .navbar {
            height: 68px;
            background: #fff;
            border-bottom: 1px solid #eee;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            position: sticky;
            top: 0;
            z-index: 20;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 21px;
            font-weight: 700;
        }

        .logo-icon {
            width: 38px;
            height: 38px;

            border-radius: 11px;

            background: linear-gradient(
                135deg,
                #ed3d82,
                #bd3fd4
            );

            color: #fff;

            display: grid;
            place-items: center;
        }

        .nav {
            display: flex;
            gap: 30px;

            font-size: 14px;
        }

        .nav a:hover {
            color: #e63891;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            border: 0;
            border-radius: 11px;

            padding: 11px 17px;

            background: #111827;
            color: #fff;

            font-weight: 700;
            cursor: pointer;
        }

        .btn.pink {
            background: #f63d67;
        }

        /* Hamburger is shown on smaller screens */
        .hamburger {
            display: none;

            width: 42px;
            height: 42px;

            border: 1px solid #ddd;
            border-radius: 10px;

            background: #fff;

            font-size: 21px;
            cursor: pointer;
        }


        /* =========================================================
           SEARCH AND FILTERS
        ========================================================= */

        .filters {
            background: #fff;
            border-bottom: 1px solid #eee;

            padding: 18px 30px;

            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search {
            height: 49px;
            flex: 1;

            border: 1px solid #dfe3eb;
            border-radius: 12px;

            padding: 0 16px;

            font-size: 14px;
            outline: none;
        }

        .select {
            height: 49px;

            border: 1px solid #dfe3eb;
            border-radius: 12px;

            background: #fff;

            padding: 0 38px 0 14px;

            font-size: 14px;
            outline: none;
        }

        .search:focus,
        .select:focus {
            border-color: #e63891;
            box-shadow: 0 0 0 3px #e6389118;
        }


        /* =========================================================
           MAIN CONTENT
        ========================================================= */

        .wrap {
            max-width: 1280px;

            margin: auto;

            padding: 28px 30px 70px;
        }

        .heading {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 22px;
        }

        .heading h1 {
            font-size: 25px;
            margin: 0;
        }

        .count {
            color: #697083;
            font-size: 13px;
        }


        /* =========================================================
           ARTIST GRID
        ========================================================= */

        .grid {
            display: grid;

            grid-template-columns: repeat(
                4,
                minmax(0, 1fr)
            );

            gap: 22px;
        }

        .artist-card {
            background: #fff;

            border: 1px solid #eee;
            border-radius: 19px;

            overflow: hidden;

            box-shadow: 0 8px 25px #1c20300a;

            display: flex;
            flex-direction: column;

            transition:
                transform 0.18s,
                box-shadow 0.18s;
        }

        .artist-card:hover {
            transform: translateY(-3px);

            box-shadow: 0 12px 30px #1c203018;
        }


        /* =========================================================
           ARTIST IMAGE
           
           Clicking the image opens artist-profile.html
        ========================================================= */

        .photo {
            height: 230px;

            background: #eee;

            position: relative;

            cursor: pointer;
        }

        .photo img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }

        .available {
            position: absolute;

            left: 12px;
            top: 12px;

            background: #fff;

            border-radius: 30px;

            padding: 8px 12px;

            font-size: 11px;
            font-weight: 700;

            box-shadow: 0 4px 12px #0001;
        }

        .available i {
            display: inline-block;

            width: 8px;
            height: 8px;

            background: #27c76f;

            border-radius: 50%;

            margin-right: 6px;
        }

        .available.off i {
            background: #bbb;
        }


        /* =========================================================
           ARTIST CARD BODY
        ========================================================= */

        .body {
            padding: 16px 18px 18px;

            flex: 1;
        }

        .top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            gap: 10px;
        }

        /* Artist name also opens the profile */
        .name {
            font-size: 17px;
            font-weight: 700;

            cursor: pointer;
        }

        .name:hover {
            color: #e63891;
        }

        .rating {
            background: #f8fafc;

            border-radius: 9px;

            padding: 8px 9px;

            font-size: 12px;

            white-space: nowrap;
        }

        .location {
            color: #687186;

            font-size: 13px;

            margin: 10px 0;
        }


        /* =========================================================
           SERVICE TAGS
        ========================================================= */

        .tags {
            display: flex;
            flex-wrap: wrap;

            gap: 7px;

            margin: 10px 0 15px;
        }

        .tag {
            background: #fff0f4;
            color: #ed3d67;

            border-radius: 20px;

            padding: 6px 9px;

            font-size: 11px;
        }

        .experience {
            font-size: 12px;
            color: #687186;

            margin-bottom: 12px;
        }


        /* =========================================================
           FAVORITE BUTTON
        ========================================================= */

        .card-actions {
            display: flex;
            justify-content: flex-end;
        }

        .favorite {
            width: 44px;
            height: 42px;

            border: 1px solid #eadde4;
            border-radius: 10px;

            background: #fff;

            cursor: pointer;

            font-size: 18px;
        }

        .favorite.saved {
            background: #fff0f4;
            color: #e63891;

            border-color: #e63891;
        }


        /* =========================================================
           EMPTY STATE
        ========================================================= */

        .empty {
            grid-column: 1 / -1;

            text-align: center;

            background: #fff;

            border: 1px dashed #ddd;
            border-radius: 16px;

            padding: 55px 20px;

            color: #687186;
        }

        .empty h2 {
            color: #171b2d;

            margin: 0 0 8px;
        }


        /* =========================================================
           MOBILE HAMBURGER MENU
        ========================================================= */

        .mobile-menu {
            display: none;

            position: fixed;
            inset: 0;

            z-index: 50;
        }

        .mobile-menu.open {
            display: block;
        }

        .mobile-menu .shade {
            position: absolute;
            inset: 0;

            background: #0008;
        }

        .drawer {
            position: absolute;

            right: 0;
            top: 0;

            height: 100%;

            width: min(360px, 88%);

            background: #fff;

            padding: 25px;
        }

        .drawer .close {
            float: right;

            border: 1px solid #ddd;
            border-radius: 9px;

            background: #fff;

            padding: 7px 10px;

            font-size: 20px;

            cursor: pointer;
        }

        .drawer nav {
            clear: both;

            padding-top: 55px;
        }

        .drawer a {
            display: block;

            padding: 14px 0;

            font-weight: 600;
        }

        .drawer a:hover {
            color: #e63891;
        }

        .drawer .drawer-btn {
            display: block;

            background: #f63d67;
            color: #fff;

            text-align: center;

            border-radius: 11px;

            padding: 13px;

            margin-top: 20px;
        }


        /* =========================================================
           RESPONSIVE DESIGN
        ========================================================= */

        /* Tablet */
        @media (max-width: 1050px) {

            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }


        /* Small tablet / mobile */
        @media (max-width: 800px) {

            .grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .nav,
            .actions {
                display: none;
            }

            .hamburger {
                display: block;
            }

            .filters {
                flex-wrap: wrap;
                padding: 15px;
            }

            .search {
                flex-basis: 100%;
            }
        }


        /* Phone */
        @media (max-width: 560px) {

            .grid {
                grid-template-columns: 1fr;
            }

            .wrap {
                padding: 22px 14px 50px;
            }

            .navbar {
                padding: 0 14px;
            }

            .photo {
                height: 280px;
            }
        }
    </style>
</head>


<body>

    <!-- =========================================================
         NAVIGATION BAR
    ========================================================== -->

    <header class="navbar">

        <!-- NailBook logo -->
        <a
            class="logo"
            href="Home%20page.html"
        >
            <span class="logo-icon">✧</span>
            NailBook
        </a>


        <!-- Desktop navigation -->
        <nav class="nav">

            <a href="Home%20page.html">
                Home
            </a>

            <a href="Find%20artist.html">
                Find Artists
            </a>


        </nav>


        <!-- Desktop login / signup buttons -->
        <div class="actions">

            <a
                class="btn"
                href="loginclient.html"
            >
                Log in
            </a>

            <a
                class="btn pink"
                href="sign up.html"
            >
                Sign up
            </a>

        </div>


        <!-- Mobile hamburger button -->
        <button
            class="hamburger"
            id="menuBtn"
            aria-label="Open menu"
        >
            ☰
        </button>

    </header>


    <!-- =========================================================
         SEARCH AND FILTER SECTION
    ========================================================== -->

    <section class="filters">

        <!-- Search artist or location -->
        <input
            id="searchInput"
            class="search"
            placeholder="Search by location or artist name..."
            autocomplete="off"
        >


        <!-- Specialty filter -->
        <select
            id="specialtyFilter"
            class="select"
        >
            <option value="">
                All Specialties
            </option>
        </select>


        <!-- Sorting -->
        <select
            id="sortFilter"
            class="select"
        >
            <option value="rating">
                Top Rated
            </option>

            <option value="reviews">
                Most Reviewed
            </option>

            <option value="name">
                Name A-Z
            </option>
        </select>

    </section>


    <!-- =========================================================
         ARTIST DIRECTORY
    ========================================================== -->

    <main class="wrap">

        <div class="heading">

            <h1>
                All Artists
            </h1>

            <span
                id="artistCount"
                class="count"
            >
                Loading...
            </span>

        </div>


        <!-- Artist cards are inserted here using JavaScript -->

            id="artistGrid"
            class="grid"
        >

                    Loading artists...
                </h2>

                <p>
                    Connecting to NailBook.
                </p>

            </div>

        </div>

    </main>


    <!-- =========================================================
         MOBILE MENU
    ========================================================== -->

    <div
        id="mobileMenu"
        class="mobile-menu"
    >

        <!-- Dark background -->
        <div
            id="shade"
            class="shade"
        ></div>


        <!-- Side drawer -->
        <aside class="drawer">

            <button
                class="close"
                id="closeMenu"
                aria-label="Close menu"
            >
                ×
            </button>


            <nav>

                <a href="Home%20page.html">
                    Home
                </a>

                <a href="Find%20artist.html">
                    Find Artists
                </a>

                <a href="helpandsupport.html">
                    Help &amp; Support
                </a>

                <a href="Contact%20us.html">
                    Contact Us
                </a>

                <a
                    class="drawer-btn"
                    href="sign up.html"
                >
                    Sign up / Log in
                </a>

            </nav>

        </aside>

    </div>


    <!-- =========================================================
         EXTENDED FOOTER
         
         This footer is used on Find Artists and Help & Support.
    ========================================================== -->

    <div id="siteFooter"></div>


    <!-- =========================================================
         SUPABASE AND SHARED JAVASCRIPT
    ========================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="app.js"></script>

    <script src="auth.js"></script>

    <script src="footer.js"></script>


    <!-- =========================================================
         FIND ARTISTS JAVASCRIPT
    ========================================================== -->

    <script>

        /* ---------------------------------------------------------
           Application state
        --------------------------------------------------------- */

        const state = {
            artists: [],
            favorites: new Set()
        };


        /* ---------------------------------------------------------
           Helper functions
        --------------------------------------------------------- */

        const $ = id =>
            document.getElementById(id);

        const normalize = value =>
            String(value || '')
                .toLowerCase()
                .trim();

        const fallbackImage =
            'https://images.unsplash.com/photo-1604654894610-df63bc536371?auto=format&fit=crop&w=900&q=80';


        /* ---------------------------------------------------------
           Artist profile URL
        --------------------------------------------------------- */

        function profileUrl(artistId) {

            return `artist-profile.html?id=${encodeURIComponent(artistId)}`;

        }


        /* ---------------------------------------------------------
           Get artist gallery image
           
           If the artist has no gallery image,
           use the default NailBook image.
        --------------------------------------------------------- */

        function imageFor(artist) {

            return Array.isArray(artist.gallery) &&
                artist.gallery.length

                ? artist.gallery[0]

                : fallbackImage;

        }


        /* =========================================================
           RENDER ARTISTS
        ========================================================== */

        function render() {

            const search =
                normalize(
                    $('searchInput').value
                );

            const specialty =
                normalize(
                    $('specialtyFilter').value
                );

            const sort =
                $('sortFilter').value;


            /* -----------------------------------------------------
               Filter artists
            ----------------------------------------------------- */

            let artists =
                state.artists.filter(artist => {

                    const services =
                        (artist.services || [])
                            .map(service =>
                                normalize(
                                    service.service_name
                                )
                            );

                    const searchableText =
                        normalize(
                            `${artist.business_name || ''} ${artist.location || ''}`
                        );


                    return (
                        (!search ||
                            searchableText.includes(search)) &&

                        (!specialty ||
                            services.includes(specialty))
                    );

                });


            /* -----------------------------------------------------
               Sort artists
            ----------------------------------------------------- */

            artists.sort((a, b) => {

                if (sort === 'name') {

                    return normalize(
                        a.business_name
                    ).localeCompare(
                        normalize(b.business_name)
                    );

                }


                if (sort === 'reviews') {

                    return Number(
                        b.review_count || 0
                    ) - Number(
                        a.review_count || 0
                    );

                }


                return Number(
                    b.average_rating || 0
                ) - Number(
                    a.average_rating || 0
                );

            });


            /* -----------------------------------------------------
               Display artist count
            ----------------------------------------------------- */

            $('artistCount').textContent =
                `${artists.length} artist${
                    artists.length === 1
                        ? ''
                        : 's'
                }`;


            /* -----------------------------------------------------
               Empty result
            ----------------------------------------------------- */

            if (!artists.length) {

                $('artistGrid').innerHTML = `
                    <div class="empty">
                        <h2>No artists found</h2>
                        <p>
                            Try another city, artist name,
                            or specialty.
                        </p>
                    </div>
                `;

                return;
            }


            /* -----------------------------------------------------
               Create artist cards
            ----------------------------------------------------- */

            $('artistGrid').innerHTML =
                artists.map(artist => {

                    const tags =
                        (artist.services || [])
                            .slice(0, 6)
                            .map(service =>
                                `<span class="tag">
                                    ${safeText(
                                        service.service_name
                                    )}
                                </span>`
                            )
                            .join('');


                    const saved =
                        state.favorites.has(
                            artist.artist_id
                        );


                    return `
                        <article class="artist-card">

                            <!--
                                Clicking the artist image
                                opens the artist profile.
                            -->
                            <div
                                class="photo"
                                data-profile="${safeText(
                                    artist.artist_id
                                )}"
                                title="View artist profile"
                            >

                                <img
                                    src="${safeText(
                                        imageFor(artist)
                                    )}"
                                    alt="${safeText(
                                        artist.business_name
                                    )}"
                                >

                                <span
                                    class="available ${
                                        artist.is_available
                                            ? ''
                                            : 'off'
                                    }"
                                >

                                    <i></i>

                                    ${
                                        artist.is_available
                                            ? 'Available'
                                            : 'Currently unavailable'
                                    }

                                </span>

                            </div>


                            <div class="body">

                                <div class="top">

                                    <!--
                                        Clicking the artist name
                                        also opens the profile.
                                    -->
                                    <div
                                        class="name"
                                        data-profile="${safeText(
                                            artist.artist_id
                                        )}"
                                        title="View artist profile"
                                    >
                                        ${safeText(
                                            artist.business_name
                                        )}
                                    </div>


                                    <div class="rating">

                                        ⭐ ${
                                            Number(
                                                artist.average_rating || 0
                                            ).toFixed(1)
                                        }

                                        <span
                                            style="color:#8a91a2"
                                        >
                                            (${
                                                Number(
                                                    artist.review_count || 0
                                                )
                                            })
                                        </span>

                                    </div>

                                </div>


                                <!-- Artist location -->
                                <div class="location">
                                    📍 ${
                                        safeText(
                                            artist.location ||
                                            'Location not listed'
                                        )
                                    }
                                </div>


                                <!-- Artist services -->
                                <div class="tags">

                                    ${
                                        tags ||
                                        '<span class="tag">No services listed</span>'
                                    }

                                </div>


                                <!-- Experience -->
                                <div class="experience">
                                    ◷ ${
                                        Number(
                                            artist.years_experience || 0
                                        )
                                    }
                                    years experience
                                </div>


                                <!-- Favorite button -->
                                <div class="card-actions">

                                    <button
                                        class="favorite ${
                                            saved
                                                ? 'saved'
                                                : ''
                                        }"
                                        data-favorite="${safeText(
                                            artist.artist_id
                                        )}"
                                        title="Save artist"
                                        aria-label="Save artist"
                                    >
                                        ${
                                            saved
                                                ? '♥'
                                                : '♡'
                                        }
                                    </button>

                                </div>

                            </div>

                        </article>
                    `;

                }).join('');


            /* -----------------------------------------------------
               Artist profile click events
            ----------------------------------------------------- */

            document
                .querySelectorAll('[data-profile]')
                .forEach(element => {

                    element.addEventListener(
                        'click',
                        () => {

                            window.location.href =
                                profileUrl(
                                    element.dataset.profile
                                );

                        }
                    );

                });


            /* -----------------------------------------------------
               Favorite click events
            ----------------------------------------------------- */

            document
                .querySelectorAll('[data-favorite]')
                .forEach(button => {

                    button.addEventListener(
                        'click',
                        event => {

                            event.stopPropagation();

                            toggleFavorite(
                                button.dataset.favorite
                            );

                        }
                    );

                });

        }


        /* =========================================================
           LOAD FAVORITES
        ========================================================== */

        async function loadFavorites() {

            const user =
                await getSignedInUser();


            if (!user) {
                return;
            }


            const {
                data,
                error
            } = await supabaseClient
                .from('favorites')
                .select('artist_id')
                .eq(
                    'client_id',
                    user.id
                );


            if (!error) {

                state.favorites =
                    new Set(
                        (data || [])
                            .map(
                                item =>
                                    item.artist_id
                            )
                    );

            }

        }


        /* =========================================================
           LOAD ARTISTS FROM SUPABASE
        ========================================================== */

        async function loadArtists() {

            const {
                data,
                error
            } = await supabaseClient
                .from('v_artist_directory')
                .select('*');


            /* -----------------------------------------------------
               Supabase error
            ----------------------------------------------------- */

            if (error) {

                console.error(error);


                $('artistGrid').innerHTML = `
                    <div class="empty">

                        <h2>
                            Could not load artists
                        </h2>

                        <p>
                            ${safeText(error.message)}
                        </p>

                    </div>
                `;


                $('artistCount').textContent =
                    '0 artists';

                return;
            }


            /* Save artists */
            state.artists =
                data || [];


            /* -----------------------------------------------------
               Build specialty dropdown
            ----------------------------------------------------- */

            const specialties = [
                ...new Set(
                    state.artists
                        .flatMap(
                            artist =>
                                (artist.services || [])
                                    .map(
                                        service =>
                                            service.service_name
                                    )
                        )
                        .filter(Boolean)
                )
            ].sort();


            $('specialtyFilter').innerHTML = `
                <option value="">
                    All Specialties
                </option>

                ${
                    specialties
                        .map(
                            name =>
                                `<option value="${safeText(name)}">
                                    ${safeText(name)}
                                </option>`
                        )
                        .join('')
                }
            `;


            /* -----------------------------------------------------
               Receive city search from Home page
            ----------------------------------------------------- */

            const city =
                new URLSearchParams(
                    window.location.search
                ).get('city');


            if (city) {

                $('searchInput').value =
                    city;

            }


            /* Load favorites */
            await loadFavorites();


            /* Display artists */
            render();

        }


        /* =========================================================
           FAVORITES
        ========================================================== */

        async function toggleFavorite(artistId) {

            const user =
                await getSignedInUser();


            /* Client must be logged in */
            if (!user) {

                window.location.href =
                    'loginclient.html';

                return;
            }


            /* Check account role */
            const profile =
                await getProfile(
                    user.id
                );


            if (
                !profile ||
                profile.role !== 'client'
            ) {

                alert(
                    'Please use a client account to save artists.'
                );

                return;
            }


            /* -----------------------------------------------------
               Remove favorite
            ----------------------------------------------------- */

            if (
                state.favorites.has(
                    artistId
                )
            ) {

                const {
                    error
                } = await supabaseClient
                    .from('favorites')
                    .delete()
                    .eq(
                        'client_id',
                        user.id
                    )
                    .eq(
                        'artist_id',
                        artistId
                    );


                if (error) {

                    return alert(
                        error.message
                    );

                }


                state.favorites.delete(
                    artistId
                );

            }


            /* -----------------------------------------------------
               Add favorite
            ----------------------------------------------------- */

            else {

                const {
                    error
                } = await supabaseClient
                    .from('favorites')
                    .insert({
                        client_id: user.id,
                        artist_id: artistId
                    });


                if (error) {

                    return alert(
                        error.message
                    );

                }


                state.favorites.add(
                    artistId
                );

            }


            /* Refresh artist cards */
            render();

        }


        /* =========================================================
           SEARCH AND FILTER EVENTS
        ========================================================== */

        $('searchInput')
            .addEventListener(
                'input',
                render
            );


        $('specialtyFilter')
            .addEventListener(
                'change',
                render
            );


        $('sortFilter')
            .addEventListener(
                'change',
                render
            );


        /* =========================================================
           MOBILE HAMBURGER MENU
        ========================================================== */

        $('menuBtn').onclick = () => {

            $('mobileMenu')
                .classList
                .add('open');

        };


        $('closeMenu').onclick = () => {

            $('mobileMenu')
                .classList
                .remove('open');

        };


        $('shade').onclick = () => {

            $('mobileMenu')
                .classList
                .remove('open');

        };


        /* =========================================================
           START APPLICATION
        ========================================================== */

        loadArtists();

    </script>

</body>

</html>
