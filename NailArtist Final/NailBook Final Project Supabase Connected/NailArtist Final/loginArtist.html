<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>NailBook | Artist Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: linear-gradient(135deg, #fff5f8, #fbf0ff);
            min-height: 100vh;
            color: #171b2d;
        }

        .page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 25px;
        }

        .card {
            width: min(430px, 92%);
            background: #fff;
            border: 1px solid #eee6eb;
            border-radius: 24px;
            padding: 34px;
            box-shadow: 0 18px 50px #23142818;
        }

        /* NailBook logo */
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            text-decoration: none;
            font-size: 22px;
            font-weight: 700;

            margin-bottom: 28px;
        }

        .icon {
            width: 42px;
            height: 42px;

            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #ed3d82,
                #bd3fd4
            );

            color: #fff;

            display: grid;
            place-items: center;
        }

        /* Page heading */
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .sub {
            text-align: center;
            color: #707586;
            font-size: 14px;
            margin-bottom: 26px;
        }

        /* Form labels */
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;

            margin: 16px 0 8px;
        }

        /* Form inputs */
        input {
            width: 100%;
            height: 50px;

            border: 1px solid #dfe3eb;
            border-radius: 12px;

            padding: 0 14px;

            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #e63891;
            box-shadow: 0 0 0 3px #e6389118;
        }

        /* Login button */
        button {
            width: 100%;
            height: 52px;

            border: 0;
            border-radius: 13px;

            background: #111827;
            color: #fff;

            font-weight: 700;
            font-size: 15px;

            cursor: pointer;

            margin-top: 22px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Login messages */
        .message {
            min-height: 20px;

            text-align: center;
            font-size: 13px;

            margin-top: 12px;
        }

        /* Bottom account link */
        .bottom {
            text-align: center;

            font-size: 13px;
            color: #707586;

            margin-top: 22px;
        }

        .bottom a {
            color: #e63891;
            font-weight: 600;
        }
    </style>

    <!-- Shared NailBook styles -->
    <link href="nailbook-shared.css" rel="stylesheet">
</head>

<body>

    <div class="page">

        <div class="card">

            <!-- NailBook logo -->
            <a class="logo" href="Home%20page.html">
                <span class="icon">✧</span>
                NailBook
            </a>

            <!-- Page heading -->
            <h1>Artist login</h1>

            <p class="sub">
                Log in to manage your NailBook artist dashboard.
            </p>

            <!-- Login form -->
            <form id="loginForm">

                <!-- Email -->
                <label for="email">
                    Email address
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Enter your email"
                    required
                >

                <!-- Password -->
                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                    required
                >

                <!-- Submit button -->
                <button
                    id="submitBtn"
                    type="submit"
                >
                    Log in
                </button>

                <!-- Login message -->
                <div
                    class="message"
                    id="message"
                ></div>

            </form>

            <!-- Sign-up link -->
            <div class="bottom">
                Don't have an artist account?
                <a href="signupArtist.html">
                    Create one
                </a>
            </div>

        </div>

    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- NailBook JavaScript -->
    <script src="app.js"></script>
    <script src="auth.js"></script>

    <!-- Shared footer container -->
    <div id="siteFooter"></div>

    <script>

        /*
         * Artist Login
         *
         * This form:
         * 1. Gets the artist's email and password.
         * 2. Sends the credentials to Supabase through auth.js.
         * 3. Checks that the account is an artist account.
         * 4. Redirects the artist to the Artist Dashboard.
         */

        document
            .getElementById('loginForm')
            .addEventListener('submit', async e => {

                e.preventDefault();

                const button =
                    document.getElementById('submitBtn');

                const message =
                    document.getElementById('message');

                const email =
                    document.getElementById('email').value;

                const password =
                    document.getElementById('password').value;

                /* Disable button while logging in */
                button.disabled = true;
                button.textContent = 'Logging in...';

                message.textContent = '';

                try {

                    /*
                     * Sign in the artist.
                     * expectedRole prevents a client account
                     * from logging into the artist dashboard.
                     */
                    await signInNailBookUser({
                        email: email,
                        password: password,
                        expectedRole: 'artist'
                    });

                    /* Show success message */
                    showAuthMessage(
                        message,
                        'Login successful. Opening your dashboard...',
                        'success'
                    );

                    /*
                     * Redirect to Artist Dashboard
                     * after successful login.
                     */
                    setTimeout(() => {
                        location.href = 'DashboardArtist.html';
                    }, 500);

                } catch (err) {

                    console.error(err);

                    /*
                     * Display login error.
                     */
                    showAuthMessage(
                        message,
                        err.message || 'Login failed.'
                    );

                    /* Enable button again */
                    button.disabled = false;
                    button.textContent = 'Log in';
                }

            });

    </script>

    <!-- Shared NailBook footer -->
    <script src="footer.js"></script>

</body>

</html>
