<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NailBook | Create Account</title>

    <!-- Main page styles -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #fff3f7,
                #fbf0ff
            );
            min-height: 100vh;
            display: grid;
            place-items: center;
            color: #171b2d;
        }

        /* Main account selection card */
        .card {
            width: min(560px, 92%);
            background: #fff;
            border: 1px solid #eee6eb;
            border-radius: 24px;
            padding: 34px;
            box-shadow: 0 20px 55px rgba(53, 21, 42, 0.10);
        }

        /* NailBook logo */
        .logo {
            text-align: center;
            font-size: 23px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .logo b {
            display: inline-grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(
                135deg,
                #ed3d82,
                #bd3fd4
            );
            color: #fff;
            margin-right: 8px;
        }

        /* Page heading */
        h1 {
            text-align: center;
            font-size: 29px;
            margin-bottom: 8px;
        }

        /* Page description */
        .sub {
            text-align: center;
            color: #73798a;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Client / Artist selection */
        .roles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Individual selection card */
        .role {
            border: 1px solid #e4e6ed;
            border-radius: 17px;
            padding: 22px;
            text-decoration: none;
            color: #171b2d;
            transition: 0.2s;
            background: #fff;
        }

        .role:hover {
            border-color: #e63891;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(230, 56, 145, 0.10);
        }

        /* Client / Artist icon */
        .role-icon {
            width: 46px;
            height: 46px;
            border-radius: 13px;
            background: #fff0f5;
            color: #e63891;
            display: grid;
            place-items: center;
            font-size: 22px;
            margin-bottom: 14px;
        }

        .role h2 {
            font-size: 17px;
            margin-bottom: 7px;
        }

        .role p {
            font-size: 13px;
            color: #73798a;
            line-height: 1.5;
        }

        /* Login link */
        .bottom {
            text-align: center;
            margin-top: 23px;
            font-size: 13px;
            color: #73798a;
        }

        .bottom a {
            color: #e63891;
            font-weight: 600;
            text-decoration: none;
        }

        /* Mobile layout */
        @media (max-width: 600px) {
            .roles {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <!-- Shared NailBook styles -->
    <link
        href="nailbook-shared.css"
        rel="stylesheet"
    >
</head>

<body>

    <!-- Account selection card -->
    <div class="card">

        <!-- NailBook logo -->
        <div class="logo">
            <b>✧</b>
            NailBook
        </div>

        <!-- Page heading -->
        <h1>Create your NailBook account</h1>

        <p class="sub">
            Choose how you will use NailBook.
        </p>

        <!-- Account type options -->
        <div class="roles">

            <!-- Client Sign Up -->
            <a
                class="role"
                href="signupclient.html"
            >
                <div class="role-icon">
                    ♡
                </div>

                <h2>
                    Sign up as a Client
                </h2>

                <p>
                    Find nail artists, book appointments
                    and manage your bookings.
                </p>
            </a>

            <!-- Artist Sign Up -->
            <a
                class="role"
                href="signupArtist.html"
            >
                <div class="role-icon">
                    ✦
                </div>

                <h2>
                    Sign up as an Artist
                </h2>

                <p>
                    Create your artist profile and manage
                    your NailBook business.
                </p>
            </a>

        </div>

        <!-- Existing account -->
        <div class="bottom">
            Already have an account?
            <a href="log in.html">
                Choose Login
            </a>
        </div>

    </div>

    <!-- Footer container -->
    <div id="siteFooter"></div>

    <!-- Footer script -->
    <script src="footer.js"></script>

</body>

</html>
