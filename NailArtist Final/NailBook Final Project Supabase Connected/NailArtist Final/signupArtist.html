<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>NailBook | Artist Sign Up</title>


    <!-- =========================
         PAGE STYLES
    ========================== -->

    <style>

        /* =========================
           GLOBAL
        ========================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Inter, Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #fff4f7,
                #fbf0ff
            );

            min-height: 100vh;

            color: #171b2d;
        }


        /* =========================
           PAGE CONTAINER
        ========================== */

        .page {
            min-height: 100vh;

            display: grid;
            place-items: center;

            padding: 22px;
        }


        /* =========================
           SIGN-UP CARD
        ========================== */

        .card {
            width: min(540px, 94%);

            background: #ffffff;

            border: 1px solid #eee6eb;
            border-radius: 24px;

            padding: 30px;

            box-shadow:
                0 18px 50px #23142814;
        }


        /* =========================
           NAILBOOK LOGO
        ========================== */

        .logo {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 10px;

            text-decoration: none;

            color: #171b2d;

            font-size: 22px;
            font-weight: 700;

            margin-bottom: 20px;
        }

        .icon {
            width: 42px;
            height: 42px;

            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #ed3d82,
                #bd3fd4
            );

            color: #ffffff;

            display: grid;
            place-items: center;
        }


        /* =========================
           HEADINGS
        ========================== */

        h1 {
            text-align: center;

            margin: 0 0 7px;

            font-size: 27px;
        }

        .sub {
            text-align: center;

            color: #707586;

            font-size: 13px;

            margin: 0 0 20px;
        }


        /* =========================
           FORM GRID
        ========================== */

        .grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 0 12px;
        }

        .full {
            grid-column: 1 / -1;
        }


        /* =========================
           FORM LABELS
        ========================== */

        label {
            display: block;

            font-size: 12px;

            font-weight: 700;

            margin: 12px 0 7px;
        }


        /* =========================
           FORM INPUTS
        ========================== */

        input {
            width: 100%;
            height: 47px;

            border: 1px solid #dfe3eb;

            border-radius: 11px;

            padding: 0 12px;

            outline: none;
        }

        input:focus {
            border-color: #e63891;

            box-shadow:
                0 0 0 3px #e6389118;
        }


        /* =========================
           SERVICES
        ========================== */

        .services {
            display: flex;

            flex-wrap: wrap;

            gap: 8px;
        }

        .service {
            border: 1px solid #eadde4;

            border-radius: 20px;

            padding: 8px 11px;

            font-size: 11px;

            cursor: pointer;
        }

        /* Hide the checkbox */

        .service input {
            display: none;
        }

        /* Selected service */

        .service:has(input:checked) {
            background: #fff0f4;

            border-color: #e63891;

            color: #e63863;
        }


        /* =========================
           SUBMIT BUTTON
        ========================== */

        button {
            width: 100%;
            height: 51px;

            margin-top: 20px;

            border: 0;

            border-radius: 12px;

            background: #111827;

            color: #ffffff;

            font-weight: 700;

            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }


        /* =========================
           MESSAGE
        ========================== */

        .msg {
            text-align: center;

            min-height: 20px;

            margin-top: 10px;

            font-size: 13px;
        }


        /* =========================
           LOGIN LINK
        ========================== */

        .bottom {
            text-align: center;

            margin-top: 17px;

            font-size: 13px;

            color: #707586;
        }

        .bottom a {
            color: #e63891;

            font-weight: 600;

            text-decoration: none;
        }

        .bottom a:hover {
            text-decoration: underline;
        }


        /* =========================
           MOBILE RESPONSIVE
        ========================== */

        @media (max-width: 500px) {

            .grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

        }

    </style>


    <!-- Shared NailBook Styles -->

    <link
        href="nailbook-shared.css"
        rel="stylesheet"
    >

</head>


<body>


    <!-- =========================
         SIGN-UP PAGE
    ========================== -->

    <div class="page">

        <!-- Sign-up Card -->

        <div class="card">


            <!-- =====================
                 NAILBOOK LOGO
            ====================== -->

            <a
                class="logo"
                href="Home%20page.html"
            >

                <span class="icon">
                    ✧
                </span>

                NailBook

            </a>


            <!-- =====================
                 PAGE HEADING
            ====================== -->

            <h1>
                Create your artist account
            </h1>

            <p class="sub">
                Join NailBook and manage your nail business.
            </p>


            <!-- =========================
                 SIGN-UP FORM
            ========================== -->

            <form id="signupForm">


                <div class="grid">


                    <!-- =====================
                         BUSINESS NAME
                    ====================== -->

                    <div class="full">

                        <label for="name">
                            Artist / business name
                        </label>

                        <input
                            id="name"
                            type="text"
                            placeholder="e.g. Techloom"
                            required
                        >

                    </div>


                    <!-- =====================
                         EMAIL
                    ====================== -->

                    <div class="full">

                        <label for="email">
                            Email address
                        </label>

                        <input
                            id="email"
                            type="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <!-- =====================
                         PASSWORD
                    ====================== -->

                    <div>

                        <label for="password">
                            Password
                        </label>

                        <input
                            id="password"
                            type="password"
                            minlength="6"
                            placeholder="At least 6 characters"
                            required
                        >

                    </div>


                    <!-- =====================
                         LOCATION
                    ====================== -->

                    <div>

                        <label for="location">
                            Location
                        </label>

                        <input
                            id="location"
                            type="text"
                            placeholder="City, State"
                            required
                        >

                    </div>


                    <!-- =====================
                         SERVICES
                    ====================== -->

                    <div class="full">

                        <label>
                            Services you offer
                        </label>

                        <div
                            class="services"
                            id="services"
                        >
                            Loading services...
                        </div>

                    </div>

                </div>


                <!-- =========================
                     CREATE ACCOUNT BUTTON
                ========================== -->

                <button
                    id="submitBtn"
                    type="submit"
                >
                    Create artist account
                </button>


                <!-- =========================
                     STATUS MESSAGE
                ========================== -->

                <div
                    class="msg"
                    id="message"
                ></div>

            </form>


            <!-- =========================
                 LOGIN LINK
            ========================== -->

            <div class="bottom">

                Already have an account?

                <a href="loginArtist.html">
                    Log in
                </a>

            </div>

        </div>

    </div>


    <!-- =========================
         SUPABASE
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- NailBook Application Files -->

    <script src="app.js"></script>

    <script src="auth.js"></script>


    <!-- Footer Container -->

    <div id="siteFooter"></div>


    <!-- =========================
         LOAD SERVICES
    ========================== -->

    <script>

        (async function () {

            const {
                data,
                error
            } = await supabaseClient
                .from("services")
                .select(
                    "service_id, service_name"
                )
                .order("service_name");


            const box =
                document.getElementById("services");


            /* If services cannot be loaded */

            if (error) {

                box.textContent =
                    "Could not load services. Run nailbook.sql first.";

                return;
            }


            /* Display available services */

            box.innerHTML =
                (data || [])
                    .map(function (service) {

                        return `
                            <label class="service">

                                <input
                                    type="checkbox"
                                    value="${safeText(service.service_name)}"
                                >

                                ${safeText(service.service_name)}

                            </label>
                        `;

                    })
                    .join("");

        })();

    </script>


    <!-- =========================
         ARTIST SIGN-UP
    ========================== -->

    <script>

        document
            .getElementById("signupForm")
            .addEventListener(
                "submit",
                async function (e) {

                    e.preventDefault();


                    const form =
                        e.currentTarget;

                    const button =
                        document.getElementById(
                            "submitBtn"
                        );

                    const message =
                        document.getElementById(
                            "message"
                        );


                    /* Get selected services */

                    const services = [
                        ...document.querySelectorAll(
                            "#services input:checked"
                        )
                    ].map(
                        checkbox => checkbox.value
                    );


                    /* Require at least one service */

                    if (!services.length) {

                        showAuthMessage(
                            message,
                            "Please select at least one service."
                        );

                        return;
                    }


                    /* Disable button */

                    button.disabled = true;

                    button.textContent =
                        "Creating account...";

                    message.textContent = "";


                    try {

                        /* Create the NailBook artist account */

                        const data =
                            await signUpNailBookUser({

                                role: "artist",

                                email:
                                    document
                                        .getElementById("email")
                                        .value,

                                password:
                                    document
                                        .getElementById("password")
                                        .value,

                                fullName:
                                    document
                                        .getElementById("name")
                                        .value
                                        .trim(),

                                businessName:
                                    document
                                        .getElementById("name")
                                        .value
                                        .trim(),

                                location:
                                    document
                                        .getElementById("location")
                                        .value
                                        .trim(),

                                services:
                                    services

                            });


                        /* =====================
                           ACCOUNT CREATED
                        ====================== */

                        if (data.session) {

                            showAuthMessage(
                                message,
                                "Account created. Opening your dashboard...",
                                "success"
                            );


                            /*
                             * Send the artist directly
                             * to the artist dashboard.
                             */

                            setTimeout(
                                function () {

                                    location.href =
                                        "DashboardArtist.html";

                                },
                                600
                            );

                        } else {

                            /*
                             * Email confirmation is required
                             * before the user can log in.
                             */

                            showAuthMessage(
                                message,
                                "Account created. Check your email to confirm it, then log in as an artist.",
                                "success"
                            );


                            button.disabled = false;

                            button.textContent =
                                "Create artist account";
                        }

                    } catch (err) {

                        console.error(err);


                        /* Display the error */

                        showAuthMessage(
                            message,
                            err.message ||
                                "Could not create the account."
                        );


                        /* Re-enable button */

                        button.disabled = false;

                        button.textContent =
                            "Create artist account";
                    }

                }
            );

    </script>


    <!-- Footer JavaScript -->

    <script src="footer.js"></script>

</body>

</html>
