<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NailBook | Client Login</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#fff5f8,#fbf0ff);min-height:100vh;color:#171b2d}.page{min-height:100vh;display:grid;place-items:center;padding:25px}.card{width:min(430px,92%);background:#fff;border:1px solid #eee6eb;border-radius:24px;padding:34px;box-shadow:0 18px 50px #23142818}.logo{display:flex;align-items:center;gap:10px;justify-content:center;text-decoration:none;font-size:22px;font-weight:700;margin-bottom:28px}.icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#ed3d82,#bd3fd4);color:#fff;display:grid;place-items:center}h1{text-align:center;font-size:28px;margin-bottom:8px}.sub{text-align:center;color:#707586;font-size:14px;margin-bottom:26px}label{display:block;font-size:13px;font-weight:600;margin:16px 0 8px}input{width:100%;height:50px;border:1px solid #dfe3eb;border-radius:12px;padding:0 14px;outline:none;font-size:14px}input:focus{border-color:#e63891;box-shadow:0 0 0 3px #e6389118}button{width:100%;height:52px;border:0;border-radius:13px;background:#111827;color:#fff;font-weight:700;cursor:pointer;margin-top:22px;font-size:15px}button:disabled{opacity:.6}.message{min-height:20px;text-align:center;font-size:13px;margin-top:12px}.bottom{text-align:center;font-size:13px;color:#707586;margin-top:22px}.bottom a{color:#e63891;font-weight:600}</style></head><body><div class="page"><div class="card"><a class="logo" href="Home%20page.html"><span class="icon">✧</span>NailBook</a><h1>Client login</h1><p class="sub">Log in to find artists and manage your appointments.</p><form id="loginForm"><label for="email">Email address</label><input id="email" type="email" required placeholder="Enter your email"><label for="password">Password</label><input id="password" type="password" required placeholder="Enter your password"><button id="submitBtn" type="submit">Log in</button><div id="message" class="message"></div></form><div class="bottom">Don't have a client account? <a href="signupclient.html">Create one</a></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script src="auth.js"></script><script>
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submitBtn'),message=document.getElementById('message');button.disabled=true;button.textContent='Logging in...';message.textContent='';try{await signInNailBookUser({email:document.getElementById('email').value,password:document.getElementById('password').value,expectedRole:'client'});showAuthMessage(message,'Login successful. Opening your dashboard...','success');setTimeout(()=>location.href='dashboardclient.html',500);}catch(err){console.error(err);showAuthMessage(message,err.message||'Login failed.');button.disabled=false;button.textContent='Log in';}});
</script></body></html>
