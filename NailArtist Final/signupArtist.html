<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NailBook | Artist Sign Up</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#fff4f7,#fbf0ff);min-height:100vh;color:#171b2d}.page{min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(540px,94%);background:#fff;border:1px solid #eee6eb;border-radius:24px;padding:30px;box-shadow:0 18px 50px #23142814}.logo{display:flex;justify-content:center;align-items:center;gap:10px;text-decoration:none;color:#171b2d;font-size:22px;font-weight:700;margin-bottom:20px}.icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#ed3d82,#bd3fd4);color:#fff;display:grid;place-items:center}h1{text-align:center;margin:0 0 7px;font-size:27px}.sub{text-align:center;color:#707586;font-size:13px;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:700;margin:12px 0 7px}input{width:100%;height:47px;border:1px solid #dfe3eb;border-radius:11px;padding:0 12px;outline:none}input:focus{border-color:#e63891;box-shadow:0 0 0 3px #e6389118}.services{display:flex;flex-wrap:wrap;gap:8px}.service{border:1px solid #eadde4;border-radius:20px;padding:8px 11px;font-size:11px;cursor:pointer}.service input{display:none}.service:has(input:checked){background:#fff0f4;border-color:#e63891;color:#e63863}button{width:100%;height:51px;margin-top:20px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.msg{text-align:center;min-height:20px;margin-top:10px;font-size:13px}.bottom{text-align:center;margin-top:17px;font-size:13px;color:#707586}.bottom a{color:#e63891;font-weight:600}@media(max-width:500px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="page"><div class="card"><a class="logo" href="Home%20page.html"><span class="icon">✧</span>NailBook</a><h1>Create your artist account</h1><p class="sub">Join NailBook and manage your nail business.</p><form id="signupForm"><div class="grid"><div class="full"><label for="name">Artist / business name</label><input id="name" required placeholder="e.g. Techloom"></div><div class="full"><label for="email">Email address</label><input id="email" type="email" required placeholder="you@example.com"></div><div><label for="password">Password</label><input id="password" type="password" minlength="6" required placeholder="At least 6 characters"></div><div><label for="location">Location</label><input id="location" required placeholder="City, State"></div><div class="full"><label>Services you offer</label><div id="services" class="services">Loading services...</div></div></div><button id="submitBtn" type="submit">Create artist account</button><div id="message" class="msg"></div></form><div class="bottom">Already have an account? <a href="loginArtist.html">Log in</a></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script src="auth.js"></script><script>
(async()=>{const {data,error}=await supabaseClient.from('services').select('service_id,service_name').order('service_name');const box=document.getElementById('services');if(error){box.textContent='Could not load services. Run nailbook.sql first.';return;}box.innerHTML=(data||[]).map(s=>`<label class="service"><input type="checkbox" value="${safeText(s.service_name)}">${safeText(s.service_name)}</label>`).join('');})();
document.getElementById('signupForm').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget,button=document.getElementById('submitBtn'),msg=document.getElementById('message');const services=[...document.querySelectorAll('#services input:checked')].map(x=>x.value);if(!services.length){showAuthMessage(msg,'Please select at least one service.');return;}button.disabled=true;button.textContent='Creating account...';msg.textContent='';try{const data=await signUpNailBookUser({role:'artist',email:document.getElementById('email').value,password:document.getElementById('password').value,fullName:document.getElementById('name').value.trim(),businessName:document.getElementById('name').value.trim(),location:document.getElementById('location').value.trim(),services});if(data.session){showAuthMessage(msg,'Account created. Opening your dashboard...','success');setTimeout(()=>location.href='DashboardArtist.html',600);}else{showAuthMessage(msg,'Account created. Check your email to confirm it, then log in as an artist.','success');button.disabled=false;button.textContent='Create artist account';}}catch(err){console.error(err);showAuthMessage(msg,err.message||'Could not create the account.');button.disabled=false;button.textContent='Create artist account';}});
</script></body></html>
