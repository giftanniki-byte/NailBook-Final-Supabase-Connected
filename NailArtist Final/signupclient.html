<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NailBook | Client Sign Up</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#fff4f7,#fbf0ff);min-height:100vh;color:#171b2d}.page{min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(470px,94%);background:#fff;border:1px solid #eee6eb;border-radius:24px;padding:32px;box-shadow:0 18px 50px #23142814}.logo{display:flex;justify-content:center;align-items:center;gap:10px;text-decoration:none;color:#171b2d;font-size:22px;font-weight:700;margin-bottom:20px}.icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#ed3d82,#bd3fd4);color:#fff;display:grid;place-items:center}h1{text-align:center;margin:0 0 7px;font-size:27px}.sub{text-align:center;color:#707586;font-size:13px;margin-bottom:20px}label{display:block;font-size:12px;font-weight:700;margin:14px 0 7px}input{width:100%;height:48px;border:1px solid #dfe3eb;border-radius:11px;padding:0 12px;outline:none}input:focus{border-color:#e63891;box-shadow:0 0 0 3px #e6389118}button{width:100%;height:51px;margin-top:20px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.msg{text-align:center;min-height:20px;margin-top:10px;font-size:13px}.bottom{text-align:center;margin-top:17px;font-size:13px;color:#707586}.bottom a{color:#e63891;font-weight:600}</style></head><body><div class="page"><div class="card"><a class="logo" href="Home%20page.html"><span class="icon">✧</span>NailBook</a><h1>Create your client account</h1><p class="sub">Find artists, book appointments and manage your bookings.</p><form id="signupForm"><label for="fullName">Full name</label><input id="fullName" required placeholder="Your name"><label for="email">Email address</label><input id="email" type="email" required placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" minlength="6" required placeholder="At least 6 characters"><label for="city">City</label><input id="city" required placeholder="e.g. Polokwane"><label for="phone">Phone (optional)</label><input id="phone" placeholder="Your phone number"><button id="submitBtn" type="submit">Create client account</button><div id="message" class="msg"></div></form><div class="bottom">Already have an account? <a href="loginclient.html">Log in</a></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script src="auth.js"></script><script>
document.getElementById('signupForm').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submitBtn'),msg=document.getElementById('message');button.disabled=true;button.textContent='Creating account...';msg.textContent='';try{const data=await signUpNailBookUser({role:'client',email:document.getElementById('email').value,password:document.getElementById('password').value,fullName:document.getElementById('fullName').value.trim(),city:document.getElementById('city').value.trim(),phone:document.getElementById('phone').value.trim()});if(data.session){showAuthMessage(msg,'Account created. Opening your dashboard...','success');setTimeout(()=>location.href='dashboardclient.html',600);}else{showAuthMessage(msg,'Account created. Check your email to confirm it, then log in as a client.','success');button.disabled=false;button.textContent='Create client account';}}catch(err){console.error(err);showAuthMessage(msg,err.message||'Could not create the account.');button.disabled=false;button.textContent='Create client account';}});
</script></body></html>
