<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NailBook | Artist Profile</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f8fafc;color:#111827}a{text-decoration:none;color:inherit}.navbar{height:68px;background:#fff;border-bottom:1px solid #e9e9ee;display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:20}.logo{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:700}.logo-icon{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#ed3d82,#bd3fd4);color:#fff;display:grid;place-items:center}.nav{display:flex;gap:30px;font-size:14px}.nav a:hover{color:#e63891}.actions{display:flex;gap:10px;align-items:center}.btn{border:0;border-radius:11px;padding:11px 17px;background:#111827;color:#fff;font-weight:700;cursor:pointer}.btn.pink{background:#f63d67}.page{max-width:1110px;margin:auto;padding:18px 20px 70px}.back{display:inline-flex;align-items:center;gap:9px;color:#60708a;font-size:14px;margin:0 0 22px}.back:hover{color:#e63891}.layout{display:grid;grid-template-columns:1.65fr .98fr;gap:32px;align-items:start}.gallery-main{height:495px;background:#eee;border-radius:22px;overflow:hidden;position:relative}.gallery-main img{width:100%;height:100%;object-fit:cover}.arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:50%;background:#fff;font-size:25px;cursor:pointer;box-shadow:0 4px 15px #0002}.arrow.prev{left:15px}.arrow.next{right:15px}.thumbs{display:flex;gap:12px;margin-top:18px;overflow:auto}.thumb{width:80px;height:80px;border-radius:11px;overflow:hidden;border:2px solid transparent;cursor:pointer;flex:0 0 auto}.thumb.active{border-color:#ed3d82}.thumb img{width:100%;height:100%;object-fit:cover}.card{background:#fff;border:1px solid #e8e8ec;border-radius:20px;padding:26px;box-shadow:0 8px 25px #1c20300a}.artist-head{display:flex;gap:14px;align-items:center}.avatar{width:66px;height:66px;border-radius:16px;object-fit:cover;background:#f1f1f4}.artist-name{margin:0;font-size:30px;line-height:1.1}.location{color:#60708a;font-size:14px;margin-top:6px}.metrics{display:flex;gap:12px;margin:25px 0}.metric{background:#f8fafc;border-radius:12px;padding:13px 14px;font-size:13px}.metric b{margin-left:6px}.section-title{font-size:13px;font-weight:800;margin:24px 0 10px}.tags{display:flex;gap:8px;flex-wrap:wrap}.tag{background:#fff0f4;color:#ed3d67;border-radius:8px;padding:8px 11px;font-size:12px}.service{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid #edf0f4;font-size:14px}.service:last-child{border-bottom:0}.service small{display:block;color:#60708a;margin-top:5px}.price{font-weight:800}.book{width:100%;margin-top:24px;border:0;border-radius:12px;background:#f63d67;color:#fff;padding:14px;font-size:16px;font-weight:800;cursor:pointer}.book:disabled{opacity:.55;cursor:not-allowed}.address{text-align:center;color:#60708a;font-size:13px;margin-top:17px}.about{margin-top:30px}.about h2{font-size:20px;margin-bottom:10px}.about p{color:#53637c;line-height:1.8;font-size:14px}.reviews{margin-top:30px}.review{background:#fff;border:1px solid #e8e8ec;border-radius:14px;padding:15px;margin-top:10px}.review-top{display:flex;justify-content:space-between;font-size:13px}.review p{color:#60708a;font-size:13px;line-height:1.6;margin-bottom:0}.empty{color:#60708a;padding:25px 0;text-align:center}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:70;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal-card{background:#fff;width:min(470px,100%);border-radius:20px;padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0}.x{border:0;background:#f5f5f5;border-radius:8px;padding:7px 10px;cursor:pointer}.modal label{display:block;font-size:12px;font-weight:700;margin:13px 0 6px}.modal input,.modal select{width:100%;height:45px;border:1px solid #ddd;border-radius:10px;padding:0 12px}.submit{width:100%;margin-top:15px;border:0;border-radius:10px;background:#e63891;color:#fff;padding:13px;font-weight:700;cursor:pointer}.msg{font-size:13px;min-height:20px;margin-top:10px}.hamburger{display:none;border:1px solid #ddd;background:#fff;border-radius:10px;width:42px;height:42px;font-size:21px}.mobile-menu{display:none;position:fixed;inset:0;z-index:60}.shade{position:absolute;inset:0;background:#0008}.drawer{position:absolute;right:0;top:0;height:100%;width:min(360px,88%);background:#fff;padding:25px}.drawer .close{float:right;border:1px solid #ddd;background:#fff;border-radius:9px;padding:7px 10px;font-size:20px}.drawer nav{clear:both;padding-top:55px}.drawer a{display:block;padding:14px 0;font-weight:600}.drawer .drawer-btn{background:#f63d67;color:#fff;text-align:center;border-radius:11px;padding:13px;margin-top:20px}
@media(max-width:850px){.nav,.actions{display:none}.hamburger{display:block}.layout{grid-template-columns:1fr}.gallery-main{height:430px}.artist-name{font-size:25px}}@media(max-width:560px){.navbar{padding:0 14px}.page{padding:14px 12px 50px}.gallery-main{height:330px}.card{padding:20px}.metrics{flex-wrap:wrap}}
</style></head>
<body>
<header class="navbar"><a class="logo" href="Home%20page.html"><span class="logo-icon">✧</span>NailBook</a><nav class="nav"><a href="Home%20page.html">Home</a><a href="Find%20artist.html">Find Artists</a><a href="helpandsupport.html">Help &amp; Support</a></nav><div class="actions"><a class="btn" href="loginclient.html">Log in</a><a class="btn pink" href="sign up.html">Sign up</a></div><button class="hamburger" id="menuBtn">☰</button></header>
<main class="page"><a class="back" href="Find%20artist.html">← &nbsp;Back to artists</a><div id="loading" class="empty">Loading artist profile...</div><div id="profileArea" style="display:none"><section class="layout"><div><div class="gallery-main"><img id="mainImage" alt="Artist gallery"><button class="arrow prev" id="prev">‹</button><button class="arrow next" id="next">›</button></div><div id="thumbs" class="thumbs"></div></div><aside class="card"><div class="artist-head"><img id="avatar" class="avatar" alt="Artist"><div><h1 id="artistName" class="artist-name"></h1><div id="artistLocation" class="location"></div></div></div><div class="metrics"><div class="metric">⭐ <b id="rating">0.0</b> (<span id="reviews">0</span>)</div><div class="metric">◷ <b id="experience">0 yrs exp</b></div></div><div class="section-title">Specialties</div><div id="specialties" class="tags"></div><div class="section-title">Services</div><div id="services"></div><button id="bookBtn" class="book">♙ &nbsp; Book Appointment</button><div id="address" class="address"></div></aside></section><section class="about"><h2>About</h2><p id="bio"></p></section><section class="reviews"><h2>Reviews</h2><div id="reviewList"></div></section></div></main>
<footer style="background:#fff;border-top:1px solid #eee;text-align:center;color:#8a91a2;font-size:12px;padding:30px">© 2026 NailBook. All rights reserved.</footer>
<div id="bookingModal" class="modal"><div class="modal-card"><div class="modal-head"><h2>Book appointment</h2><button class="x" id="closeBooking">×</button></div><p id="bookingArtist" style="color:#687186;font-size:13px"></p><form id="bookingForm"><label>Service</label><select id="bookingService" required></select><label>Date</label><input id="bookingDate" type="date" required><label>Start time</label><input id="bookingTime" type="time" required><label>Notes</label><input id="bookingNotes" placeholder="Optional notes"><button class="submit" type="submit">Confirm booking</button><div id="bookingMsg" class="msg"></div></form></div></div>
<div id="mobileMenu" class="mobile-menu"><div class="shade" id="shade"></div><aside class="drawer"><button class="close" id="closeMenu">×</button><nav><a href="Home%20page.html">Home</a><a href="Find%20artist.html">Find Artists</a><a href="helpandsupport.html">Help &amp; Support</a><a class="drawer-btn" href="sign up.html">Sign up / Log in</a></nav></aside></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script src="auth.js"></script>
<script>
const $=id=>document.getElementById(id);let artist=null,images=[],index=0;
function renderImage(){if(!images.length)return;$('mainImage').src=images[index];document.querySelectorAll('.thumb').forEach((x,i)=>x.classList.toggle('active',i===index))}
function renderThumbs(){ $('thumbs').innerHTML=images.map((src,i)=>`<button class="thumb ${i===0?'active':''}" data-i="${i}"><img src="${safeText(src)}" alt="Gallery image"></button>`).join('');document.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{index=Number(b.dataset.i);renderImage()});renderImage() }
async function load(){const id=new URLSearchParams(location.search).get('id');if(!id){$('loading').textContent='Artist not found.';return}const {data,error}=await supabaseClient.from('v_artist_directory').select('*').eq('artist_id',id).maybeSingle();if(error||!data){$('loading').textContent=error?.message||'Artist profile not found.';return}artist=data;images=Array.isArray(artist.gallery)&&artist.gallery.length?artist.gallery:['https://images.unsplash.com/photo-1604654894610-df63bc536371?auto=format&fit=crop&w=1200&q=85'];$('loading').style.display='none';$('profileArea').style.display='block';$('artistName').textContent=artist.business_name;$('artistLocation').textContent='♧  '+(artist.location||'Location not listed');$('avatar').src=images[0];$('rating').textContent=Number(artist.average_rating||0).toFixed(1);$('reviews').textContent=Number(artist.review_count||0);$('experience').textContent=Number(artist.years_experience||0)+' yrs exp';$('bio').textContent=artist.bio||'This artist has not added a bio yet.';$('address').textContent='📍 '+(artist.location||'Location not listed');$('specialties').innerHTML=(artist.services||[]).map(s=>`<span class="tag">${safeText(s.service_name)}</span>`).join('')||'<span class="tag">No specialties listed</span>';$('services').innerHTML=(artist.services||[]).map(s=>`<div class="service"><div>${safeText(s.service_name)}<small>${Number(s.duration_minutes||60)} min</small></div><div class="price">${Number(s.price||0)?'R'+Number(s.price).toFixed(2):'Price on request'}</div></div>`).join('')||'<div class="empty">No services listed.</div>';$('bookBtn').disabled=!artist.is_available;$('bookBtn').textContent=artist.is_available?'♙  Book Appointment':'Currently unavailable';renderThumbs();loadReviews()}
async function loadReviews(){const {data,error}=await supabaseClient.from('reviews').select('rating,review_text,created_at').eq('artist_id',artist.artist_id).eq('is_visible',true).order('created_at',{ascending:false}).limit(10);if(error){console.warn('Reviews:',error);$('reviewList').innerHTML='<div class="empty">Reviews are not available right now.</div>';return}$('reviewList').innerHTML=(data||[]).length?(data||[]).map(r=>`<div class="review"><div class="review-top"><b>NailBook Client</b><span>⭐ ${Number(r.rating).toFixed(1)}</span></div><p>${safeText(r.review_text||'No written review.')}</p></div>`).join(''):'<div class="empty">No reviews yet.</div>'}
async function openBooking(){const user=await getSignedInUser();if(!user){location.href='loginclient.html';return}const profile=await getProfile(user.id);if(!profile||profile.role!=='client'){alert('Please log in with a client account to book an appointment.');return}$('bookingArtist').textContent=artist.business_name+' · '+(artist.location||'');$('bookingService').innerHTML=(artist.services||[]).map(s=>`<option value="${safeText(s.service_id)}">${safeText(s.service_name)}${Number(s.price||0)?' — R'+Number(s.price).toFixed(2):''}</option>`).join('');$('bookingDate').min=new Date().toISOString().split('T')[0];$('bookingMsg').textContent='';$('bookingModal').classList.add('open')}
$('bookBtn').onclick=openBooking;$('closeBooking').onclick=()=>$('bookingModal').classList.remove('open');$('bookingModal').addEventListener('click',e=>{if(e.target.id==='bookingModal')e.currentTarget.classList.remove('open')});$('bookingForm').addEventListener('submit',async e=>{e.preventDefault();const user=await getSignedInUser();if(!user||!artist)return;const serviceId=Number($('bookingService').value);const service=(artist.services||[]).find(s=>Number(s.service_id)===serviceId);const btn=e.currentTarget.querySelector('.submit');const msg=$('bookingMsg');btn.disabled=true;const {error}=await supabaseClient.from('bookings').insert({client_id:user.id,artist_id:artist.artist_id,service_id:serviceId,booking_date:$('bookingDate').value,start_time:$('bookingTime').value,price:Number(service?.price||0),client_notes:$('bookingNotes').value.trim(),status:'pending'});btn.disabled=false;if(error){msg.style.color='#e63863';msg.textContent=error.message;return}msg.style.color='#199b4b';msg.textContent='Booking request sent successfully.';setTimeout(()=>location.href='dashboardclient.html',700)});
$('prev').onclick=()=>{if(!images.length)return;index=(index-1+images.length)%images.length;renderImage()};$('next').onclick=()=>{if(!images.length)return;index=(index+1)%images.length;renderImage()};$('menuBtn').onclick=()=>$('mobileMenu').style.display='block';$('closeMenu').onclick=$('shade').onclick=()=>$('mobileMenu').style.display='none';load();
</script></body></html>
